<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="description" content="スマートフォンとPCで遊べるスネークゲーム"><title>スネークゲーム</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><p class="badge">SNAKE GAME</p><h1>スネークゲーム</h1><p>ヘビを操作して食べ物を集め、できるだけ長く成長させよう。</p></div><a class="home" href="https://kentaro0810.github.io/secret-links/">ツール集に戻る</a></header><section class="toolbar"><label>難易度<select id="difficulty"><option value="slow">ゆっくり</option><option value="normal" selected>ふつう</option><option value="fast">はやい</option></select></label><button id="newGame" class="primary">新しいゲーム</button></section><section class="stats"><article><span>スコア</span><strong id="score">0</strong></article><article><span>最高記録</span><strong id="best">0</strong></article><article><span>長さ</span><strong id="length">3</strong></article></section><section class="game-card"><div id="message" class="message">スタートを押してください</div><div class="canvas-wrap"><canvas id="game" width="600" height="600" aria-label="スネークゲーム盤"></canvas><div id="overlay" class="overlay"><h2 id="overlayTitle">スネークゲーム</h2><p id="overlayText">壁や自分の体にぶつからないように、食べ物を集めよう。</p><button id="startButton" class="primary large">スタート</button></div></div><div class="controls" aria-label="方向操作"><button class="direction up" data-direction="up" aria-label="上">▲</button><button class="direction left" data-direction="left" aria-label="左">◀</button><button id="pauseButton" class="direction center" aria-label="一時停止">Ⅱ</button><button class="direction right" data-direction="right" aria-label="右">▶</button><button class="direction down" data-direction="down" aria-label="下">▼</button></div><p class="hint">PC：矢印キー・WASD　スマホ：方向ボタンまたはスワイプ</p></section><section class="howto"><h2>遊び方</h2><ul><li>赤い食べ物を取ると、スコアが10増えてヘビが長くなります。</li><li>壁または自分の体にぶつかるとゲームオーバーです。</li><li>一時停止ボタン、またはスペースキーで停止・再開できます。</li></ul></section></main><script src="script.js"></script></body></html>
